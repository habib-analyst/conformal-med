[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "conformal-med"
version = "0.1.0"
description = "Conformal prediction toolkit for medical imaging — guarantees, not just accuracy"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["torch", "numpy", "medmnist"]

[project.urls]
Homepage = "https://github.com/habib-analyst/conformal-med"
